apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketmind-ai-enterprise
  namespace: default
  labels:
    app: marketmind-ai
    tier: production
    version: "2.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: marketmind-ai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: marketmind-ai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: marketmind-core
          image: keshavmittal/marketmind-ai:v2.0-production
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
              name: streamlit-ui
            - containerPort: 8000
              name: fastapi-gateway
          envFrom:
            - configMapRef:
                name: marketmind-config
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
